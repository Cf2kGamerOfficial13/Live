<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>CF2KGAMER TAMBAYAN PH | PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.9.3/shaka-player.compiled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,sans-serif}

body{
background:radial-gradient(circle at top,#0f4aa0 0%,#06172f 50%,#000 100%)
}

.wrapper{position:relative;width:100%;height:100%}

/* SMALL PLAYER */
.player-box{
position:absolute;
top:85px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:420px;
height:240px;
background:#000;
border-radius:18px;
overflow:hidden;
border:1px solid rgba(120,210,255,.25);
box-shadow:0 10px 30px rgba(0,0,0,.6);
z-index:10;
}

video{
width:100%;
height:100%;
object-fit:cover;
background:#000
}

/* TOP */
.top{
position:absolute;top:0;left:0;width:100%;
display:flex;justify-content:space-between;align-items:center;
padding:14px 16px;
z-index:50;
background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent)
}

.menu{
width:50px;height:50px;border-radius:16px;
background:rgba(10,25,50,.75);
display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
border:1px solid rgba(120,210,255,.25);
cursor:pointer
}

.menu span{width:22px;height:2px;background:#a6e7ff;border-radius:10px}

.brand{
text-align:right;color:#dff8ff;font-family:Orbitron
}

.brand h1{font-size:13px;font-weight:900}
.brand p{font-size:10px;color:#86dcff;margin-top:3px}

/* OVERLAY */
.overlay{
position:absolute;inset:0;
display:flex;
z-index:40;
pointer-events:none
}

.panel{
width:0;
height:100%;
overflow:hidden;
background:rgba(5,15,30,.97);
backdrop-filter:blur(18px);
border-right:1px solid rgba(120,210,255,.2);
transition:.3s;
pointer-events:auto
}

.overlay.active .panel{width:320px}

.list{
padding:90px 14px 14px;
display:flex;
flex-direction:column;
gap:12px;
height:100%;
overflow-y:auto
}

.item{
display:flex;gap:10px;align-items:center;
padding:12px;border-radius:16px;
background:rgba(10,25,50,.65);
border:1px solid rgba(120,210,255,.18);
cursor:pointer;
transition:.2s
}

.item:hover{transform:translateY(-2px);background:linear-gradient(135deg,#0a84ff,#00d4ff)}

.item.active{background:linear-gradient(135deg,#0a84ff,#00d4ff)}

.logo{width:60px;height:42px;border-radius:10px;object-fit:cover;background:#000}

.title{font-size:13px;font-weight:700;color:#fff}

.status{font-size:10px;color:#7fe3ff;font-family:Orbitron;margin-top:3px}

/* STATUS */
.statusbox{
position:absolute;top:180px;left:50%;
transform:translateX(-50%);
padding:10px 14px;
border-radius:14px;
background:rgba(10,25,50,.85);
font-size:11px;
font-family:Orbitron;
display:none;
z-index:60
}
</style>
</head>

<body>

<div class="wrapper">

<div class="top">
<div class="menu" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>

<div class="brand">
<h1>CF2KGAMER</h1>
<p id="now">LIVE</p>
</div>
</div>

<div class="player-box">
<video id="video" autoplay playsinline controls muted></video>
</div>

<div class="overlay" id="overlay">
<div class="panel">
<div class="list" id="channel-list-container"></div>
</div>
</div>

<div class="statusbox" id="status">LOADING...</div>

</div>

<script>
let channels=[]
let hls=null
let shakaPlayer=null

const video=document.getElementById("video")
const overlay=document.getElementById("overlay")
const statusBox=document.getElementById("status")

const CHANNELS_URL="https://raw.githubusercontent.com/Cf2kGamerOfficial13/Cf2kGamer-Tambyan-Ph/main/channels.json"

function toggleMenu(){
overlay.classList.toggle("active")
}

async function loadChannels(retry=2){
try{
statusBox.style.display="block"
statusBox.innerText="LOADING CHANNELS..."

const res=await fetch(CHANNELS_URL+"?v="+Date.now(),{cache:"no-store"})
if(!res.ok) throw new Error("fetch fail")

channels=await res.json()

statusBox.style.display="none"
return true

}catch(e){
if(retry>0){
statusBox.innerText="RETRYING..."
return loadChannels(retry-1)
}
statusBox.innerText="FAILED TO LOAD"
return false
}
}

async function initApp(){

shaka.polyfill.installAll()
shakaPlayer=new shaka.Player(video)

let ok=await loadChannels()
if(ok){
renderChannels()
setTimeout(()=>document.querySelector(".item")?.click(),700)
}
}

async function switchChannel(ch,el){

document.querySelectorAll(".item").forEach(x=>x.classList.remove("active"))
el.classList.add("active")

document.getElementById("now").innerText=ch.title
overlay.classList.remove("active")

statusBox.style.display="block"
statusBox.innerText="CONNECTING..."

try{

if(hls){hls.destroy();hls=null}
await shakaPlayer.unload()

let url=ch.file

if(url.includes(".mpd")){

if(ch.drm?.clearkey){
shakaPlayer.configure({
drm:{clearKeys:{[ch.drm.clearkey.keyId]:ch.drm.clearkey.key}}
})
}

await shakaPlayer.load(url)

}else{

if(Hls.isSupported()){
hls=new Hls()
hls.loadSource(url)
hls.attachMedia(video)
}else{
video.src=url
}
}

video.play().catch(()=>{})

setTimeout(()=>statusBox.style.display="none",900)

}catch(e){
statusBox.innerText="CHANNEL OFFLINE"
}
}

function renderChannels(){
const container=document.getElementById("channel-list-container")
container.innerHTML=""

channels.forEach(ch=>{
const el=document.createElement("div")
el.className="item"

el.innerHTML=`
<img class="logo" src="${ch.image||''}" onerror="this.src='https://via.placeholder.com/80x50'">
<div>
<div class="title">${ch.title}</div>
<div class="status">● LIVE</div>
</div>
`

el.onclick=()=>switchChannel(ch,el)
container.appendChild(el)
})
}

document.addEventListener("DOMContentLoaded",initApp)
</script>

</body>
</html>
